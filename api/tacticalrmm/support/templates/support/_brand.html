{% load static %}{% if brand.custom_logo %}<span class="sp-brand sp-brand--custom"><img class="sp-logo" src="{{ brand.logo_url }}" alt="{{ brand.name }}"></span>{% elif brand.wordmark %}<span class="sp-brand"><picture><source srcset="{% static 'support/brand/justconnect-dark.webp' %}" media="(prefers-color-scheme: dark)"><img class="sp-wordmark" src="{% static 'support/brand/justconnect.webp' %}" alt="{{ brand.name }}" width="807" height="160"></picture></span>{% else %}<span class="sp-brand"><img class="sp-mark" src="{{ brand.logo_url }}" alt="" width="32" height="32"><span>{{ brand.name }}</span></span>{% endif %}
